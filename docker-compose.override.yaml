services: 
  backend-api-prod:
    profiles:
      - prod
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      target: builder
    env_file:
      - ./backend/.env
    environment:
      - OTEL_SERVICE_NAME=backend-api-prod
      - PORT=${PORT}
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      collector:
        condition: service_started
    networks:
      - app-network

  backend-api-dev:
    profiles:
      - dev
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.dev
      target: dev
    env_file:
      - ./backend/.env
    environment:
      - OTEL_SERVICE_NAME=backend-api-dev
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/usr/src/app # This has to be the same path as the WORKDIR in the Dockerfile
      - /usr/src/app/node_modules
    depends_on:
      collector:
        condition: service_started
    develop:
      watch:
        - path: ./backend/src
          target: /usr/src/app/src # Target needs to be the route inside the container
          action: sync
          ignore:
            - node_modules/
        - action: rebuild
          path: ./package.json
    networks:
      - app-network-dev  

  react-frontend-prod:
    profiles:
      - prod
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
      target: builder
    env_file:
      - ./frontend/.env
    environment:
      - OTEL_SERVICE_NAME=react-frontend-prod
    ports:
      - "8080:8080"
    depends_on:
      - backend-api-prod
    networks:
      - app-network

  react-frontend-dev:
    profiles:
      - dev
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile.dev
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app # This has to be the same path as the WORKDIR in the Dockerfile
      - /app/node_modules
    env_file:
      - ./frontend/.env
    environment:
      - OTEL_SERVICE_NAME=react-frontend-dev
    networks:
      - app-network-dev 
    depends_on:
      backend-api-dev:
        condition: service_started
    develop:
      watch:
        - path: ./frontend/src
          target: /app/src
          action: sync
        - path: ./frontend/package.json
          action: rebuild     
  
  collector:
    profiles:
      - dev
      - prod
    image: otel/opentelemetry-collector-contrib:0.157.0
    volumes:
      - ./backend/otelcol.yaml:/etc/otelcol-contrib/config.yaml
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - GRAFANA_OTLP_TOKEN=${GRAFANA_OTLP_TOKEN}
    ports:
      - 4318:4318
      - 4317:4317
    restart: unless-stopped
    networks:
      - app-network-dev
      - app-network

  jaeger:
    profiles:
      - dev
    image: jaegertracing/jaeger:2.20.0
    ports:
      - 16686:16686 # UI
      # Its not possible to have the same port in another service
    networks:
      - app-network-dev

networks:
  app-network-dev:
    driver: bridge
  app-network:
    driver: bridge
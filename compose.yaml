services: 
  backend-api-prod:
    profiles:
      - prod
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      target: prod
    env_file:
      - ./backend/.env
    environment:
      - OTEL_SERVICE_NAME=backend-api-prod
    ports:
      - "8000:8000"
    networks:
      - app-network-dev 

  backend-api-dev:
    profiles:
      - dev
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.dev
      target: dev
    env_file:
      - ./backend/.env
    environment:
      - OTEL_SERVICE_NAME=backend-api-dev
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/usr/src/app # This has to be the same path as the WORKDIR in the Dockerfile
      - /usr/src/app/node_modules
    depends_on:
      collector:
        condition: service_started
    develop:
      watch:
        - path: ./backend/src
          target: /usr/src/app/src # Target needs to be the route inside the container
          action: sync
          ignore:
            - node_modules/
        - action: rebuild
          path: ./package.json
    networks:
      - app-network-dev  

  react-frontend-prod:
    profiles:
      - prod
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
      target: prod
    env_file:
      - ./frontend/.env
    environment:
      - OTEL_SERVICE_NAME=react-frontend-prod
    ports:
      - "8080:8080"
    networks:
      - app-network-dev 
    depends_on:
      - backend-api-prod

  react-frotend-dev:
    profiles:
      - dev
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile.dev
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app # This has to be the same path as the WORKDIR in the Dockerfile
      - /app/node_modules
    env_file:
      - ./frontend/.env
    environment:
      - OTEL_SERVICE_NAME=react-frontend-dev
    networks:
      - app-network-dev 
    depends_on:
      backend-api-dev:
        condition: service_started
    develop:
      watch:
        - path: ./frontend/src
          target: /app/src
          action: sync
        - path: ./frontend/package.json
          action: rebuild     
  
  collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    volumes:
      - ./backend/otelcol.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - 4318:4318
    networks:
      - app-network-dev

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - 16686:16686
      - 4317:4317
    networks:
      - app-network-dev

networks:
  app-network-dev:
    driver: bridge